name: "Router-lite Canary"

# Nightly live-RPC canary for @uniswap/router-lite-sdk (Task 21's suite,
# sdks/router-lite-sdk/canary) — testing-architecture layer 6: provider caps/batching/latency,
# cross-provider quote agreement, and `eth_simulateV1` chained-call execution proof against the
# real, moving mainnet head. No private keys and no broadcasts: everything runs as the fixed,
# synthetic CANARY_TRADER, whose spending power exists only inside an eth_simulateV1 state override.
#
# AS OF C4-T5 THE SUITE COVERS TWO CHAINS: mainnet (canary.test.ts, the matrix above) AND Robinhood
# Chain (canary/robinhood.test.ts) — the first quote-only, hint-free-discovery manifest this package
# shipped. Robinhood's rows are gated on their own secret (see CANARY_RPC_URL_ROBINHOOD below) and
# skip cleanly without it, same posture as _2/_3.
#
# CANARY_RPC_URL_1 SHOULD BE A KEYED ARCHIVE ENDPOINT. The live C4-T4 run established that no free
# keyless endpoint serves both `eth_simulateV1` and unrestricted historical `eth_getLogs`, and the
# pair-matrix, long-tail-discovery and latency rows need both. Anything captured from a keyed
# endpoint is redacted before it is written down — see `redactKeyedUrl` in canary/providers.test.ts.
# That redaction covers what gets WRITTEN TO THE FIXTURE, not every code path: see
# `canary/robinhood.test.ts`'s header for the narrower, more accurate claim about what this does and
# does not catch (an uncaught error's stack can still print a keyed URL straight to these nightly logs).
#
# NEVER PR-blocking — its own workflow with no `pull_request` trigger, so it can't be added to
# required status checks by mistake. Runs nightly (cron) plus on-demand (workflow_dispatch).
#
# Gated on the CANARY_RPC_URL_1/_2/_3 repo secrets (sdks/router-lite-sdk/canary/env.ts;
# CANARY_RPC_URL_1 is required, _2/_3 are optional and only light up the cross-provider checks), plus
# CANARY_RPC_URL_ROBINHOOD (canary/env.ts) for the Robinhood Chain rows — its own secret, not a
# fourth CANARY_RPC_URL_*, because those form a same-chain provider matrix and Robinhood is a
# different chain entirely (see the env var's own comment below). Until CANARY_RPC_URL_1 is added in
# repo settings, `canaryEnabled()` returns false and the mainnet suite self-skips cleanly; absent
# CANARY_RPC_URL_ROBINHOOD, `robinhoodEnabled()` does the same for the Robinhood rows independently.
# This job stays green either way, it never fails PRs, and the failure-issue step below only fires
# once real secrets are wired up and something actually breaks.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: router-lite-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Live-RPC canary (sdks/router-lite-sdk)
    runs-on: ubuntu-latest
    # RETRY ARITHMETIC (C4-T5). 2 attempts x timeout_minutes: 35 = 70, plus ~5 for
    # checkout/install/build and the artifact upload, so the job cap is 80 and every attempt can
    # actually run to its own limit.
    #
    # THE OLD NUMBERS DID NOT ADD UP: 3 attempts x 25 minutes is 75, above the previous 60-minute job
    # cap, so a third attempt could never run to completion — it was always cut off partway by the job
    # timeout. That is the worst outcome available: the runner time is spent AND the result is a
    # job-cancelled failure indistinguishable from the canary genuinely firing, which the
    # pinned-failure-issue step below would then open an issue about.
    #
    # TWO CHANGES, EACH DELIBERATE. Attempts dropped 3 -> 2 and the per-attempt cap raised 25 -> 35,
    # because the suite got materially longer this task: canary/robinhood.test.ts adds a fourth
    # chain whose rows each spend a full QUOTE_BUDGET_MS by construction (a 0.1s chain's wave
    # iterator does not finish early — see that file's note), so one attempt now needs more than 25
    # minutes for a legitimate worst case. Given a fixed job budget, one attempt that can finish
    # beats two that cannot; a third retry is the cheapest thing to give up, since the failures this
    # retry exists for are transient provider-side ones (a 429, a lagging replica, a dropped
    # connection) and two attempts already clear almost all of them.
    #
    # None of this binds on the normal path: a typical keyed run measured 5-8 minutes and exits, so
    # the job ends in minutes. The worst case is bounded (not open-ended) by the per-row budgets in
    # the suite — LONG_TAIL_MAX_CANDIDATES x LONG_TAIL_CANDIDATE_BUDGET_MS for mainnet discovery and
    # LATENCY_BUDGET_MS per latency row (~15 min), plus, for Robinhood, two SCAN_BUDGET_MS scans
    # (6 min) + MAX_MEMECOIN_CANDIDATES x PER_CANDIDATE_BUDGET_MS for the tradeable-pool hunt (6 min)
    # + QUOTE_BUDGET_MS x 2 rows (4 min) = 16 min. ~31 minutes all told, inside one attempt's 35.
    timeout-minutes: 80
    continue-on-error: false
    permissions:
      contents: read # checkout
      issues: write # open/update the pinned "router-lite canary failing" issue on failure
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: bullfrogsec/bullfrog@dcde5841b19b7ef693224207a7fdec67fce604db # v0.8.3
        with:
          egress-policy: audit

      - name: ✅ Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          persist-credentials: false

      - name: 💽 Setup Node
        uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: 1.3.10

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0" # By default do not run HUSKY install

      - name: 🏗  Build workspace SDKs
        run: bun run g:build

      - name: 🔎 Check for the canary RPC secret
        run: |
          if [ -z "$CANARY_RPC_URL_1" ]; then
            echo "::notice::CANARY_RPC_URL_1 is not configured on this repo yet — canaryEnabled() returns false and the suite below will self-skip every test. Add CANARY_RPC_URL_1 (and optionally _2/_3) in repo settings to turn the canary on."
          fi
        env:
          CANARY_RPC_URL_1: ${{ secrets.CANARY_RPC_URL_1 }}

      - name: 🧪 Canary suite (live mainnet head)
        uses: nick-fields/retry@7d4a37704547a311dbb66ebdf5b23ec19374a767
        env:
          ROUTER_LITE_CANARY: "1"
          CANARY_RPC_URL_1: ${{ secrets.CANARY_RPC_URL_1 }}
          CANARY_RPC_URL_2: ${{ secrets.CANARY_RPC_URL_2 }}
          CANARY_RPC_URL_3: ${{ secrets.CANARY_RPC_URL_3 }}
          # Robinhood Chain (4663) rows only — canary/robinhood.test.ts skips cleanly without it,
          # so this secret is as optional as _2/_3 (see that file's gating note). It is a SEPARATE
          # variable rather than a fourth CANARY_RPC_URL_* because those form a same-chain provider
          # matrix for cross-provider agreement; a different chain's endpoint is not a peer in that
          # matrix and would be compared against mainnet quotes if it were added to it.
          CANARY_RPC_URL_ROBINHOOD: ${{ secrets.CANARY_RPC_URL_ROBINHOOD }}
        with:
          # See the job's `timeout-minutes` comment above for why this is 2 x 35 and not 3 x 25.
          timeout_minutes: 35
          retry_wait_seconds: 2
          max_attempts: 2
          command: bun test sdks/router-lite-sdk/canary

      # -------------------------------------------------------------------
      # Publish pool lists from what the canary just warmed.
      #
      # WHY HERE AND NOT IN ITS OWN WORKFLOW. Building a list needs a warm
      # snapshot, and warming one is the expensive part — a full-history
      # adjacency sweep against a keyed archive endpoint. The canary already
      # holds exactly that endpoint and has just spent 5-30 minutes driving
      # real searches through it. A separate workflow would re-pay the warming
      # cost nightly for no new information.
      #
      # THE SOURCE IS THE CLI'S OWN CACHE, not the canary suite's in-process
      # indexes: the canary builds routers directly against viem clients and
      # never touches `cli/cache.ts`. So this step warms the cache itself, via
      # `buildPoolList.ts --warm` (which drives `rl discover` per token — the
      # tool that already knows how to bound a search and bank partial
      # coverage), against an $XDG_CACHE_HOME scoped to the runner.
      #
      # NON-BLOCKING, LIKE EVERY OTHER ROW HERE. `continue-on-error: true`
      # plus a per-chain `|| true`: an endpoint that rate-limits the warm run,
      # or a curation assertion that fires, must not turn the canary red — the
      # canary's job is to report on the SDK against live chains, and a missing
      # artifact is self-evident from the artifact list. A curation failure
      # that matters shows up as a build error in this step's log and as an
      # absent list, which is the same signal, unmissable, without the pinned
      # failure issue firing for something that is not a routing regression.
      #
      # THE LISTS ARE ARTIFACTS, NOT COMMITS. Nothing here writes to the repo:
      # a pool list is a cache of re-readable chain state (see
      # docs/pool-lists.md), it is regenerated nightly, and committing hundreds
      # of megabytes of it would be storing the one thing that is cheapest to
      # rebuild. Consumers fetch the artifact.
      - name: 🧾 Build pool lists from the warmed state
        if: always()
        continue-on-error: true
        env:
          CANARY_RPC_URL_1: ${{ secrets.CANARY_RPC_URL_1 }}
          CANARY_RPC_URL_ROBINHOOD: ${{ secrets.CANARY_RPC_URL_ROBINHOOD }}
          XDG_CACHE_HOME: ${{ runner.temp }}/rl-cache
        run: |
          set -u
          cd sdks/router-lite-sdk
          # chain id : env var holding its endpoint : tokens to warm on
          build() {
            chain="$1"; url="$2"; warm="$3"
            if [ -z "$url" ]; then
              echo "::notice::no endpoint configured for chain $chain — skipping its pool list"
              return 0
            fi
            echo "--- pool list: chain $chain ---"
            # The URL is passed through the environment, never on a command line (a process listing
            # is world-readable on a runner), and `buildPoolList.ts` never prints it.
            ETH_RPC_URL="$url" bun scripts/buildPoolList.ts --chain "$chain" --warm "$warm" \
              --warm-budget 180s --max-pools 400000 || echo "::warning::pool list for chain $chain failed — see above"
          }
          build 1 "${CANARY_RPC_URL_1:-}" "usdc,weth"
          build 4663 "${CANARY_RPC_URL_ROBINHOOD:-}" "weth"
          ls -la pool-lists/ 2>/dev/null || echo "no pool lists were produced"

      - name: 📤 Upload pool lists
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: router-lite-pool-lists-${{ github.run_id }}
          path: sdks/router-lite-sdk/pool-lists/*.poollist.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 📤 Upload latency benchmarks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: router-lite-canary-latency-${{ github.run_id }}
          path: sdks/router-lite-sdk/canary/latency-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 🚨 Open or update the pinned failure issue
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = 'router-lite canary failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              'The nightly `router-lite-canary` workflow failed.',
              '',
              `Run: ${runUrl}`,
              `Commit: ${context.sha}`,
            ].join('\n')

            // Plain title search across ALL open issues (no label filter — a label filter could
            // silently stop matching if a human removes/renames the label while triaging, which
            // would create a duplicate every night instead of commenting on the existing one).
            // Paginated: `listForRepo` only returns one page (30) by default, and this repo
            // already has more open issues than that, so an unpaginated call could miss the
            // pinned issue once other issues push it off page 1 — that would spam a new issue
            // every night instead of finding and commenting on the existing one. `issues.list`
            // also returns pull requests (the REST API models PRs as issues); filter those out
            // since a PR could coincidentally share the title text.
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = openIssues.find((issue) => !issue.pull_request && issue.title === title)

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }
