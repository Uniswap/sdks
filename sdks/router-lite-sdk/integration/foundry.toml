# Standalone forge project for the harness's test contracts. It is used ONCE, by hand
# (`bun run build:artifacts`), to regenerate `artifacts/contracts.json`; the test suite never shells
# out to forge. Kept minimal on purpose: no dependencies, no remappings, no test/script dirs.
[profile.default]
src = "contracts"
out = "out"
libs = []
optimizer = true
optimizer_runs = 200
solc_version = "0.8.28"
evm_version = "cancun"
